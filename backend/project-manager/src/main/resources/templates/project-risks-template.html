<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Rejestr Ryzyk Projektu</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 12px;
            color: #333;
            line-height: 1.6;
        }
        .container {
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 2px 3px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        thead {
            background-color: #3498db;
            color: #ffffff;
        }
        th {
            font-weight: bold;
            text-transform: uppercase;
        }
        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        tbody tr:hover {
            background-color: #e8f4f8;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 10px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rejestr Ryzyk Projektu</h1>

        <table>
            <thead>
                <tr>
                    <th>Nazwa</th>
                    <th>Opis</th>
                    <th>Prawdopodobieństwo (%)</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="risk : ${risks}">
                    <td th:text="${risk.name}">Ryzyko techniczne</td>
                    <td th:text="${risk.description}">Problem z integracją zewnętrznego API.</td>
                    <td th:text="${risk.probability}">75</td>
                </tr>
                <tr th:if="${risks == null or risks.isEmpty()}">
                    <td colspan="3" style="text-align: center;">Brak zdefiniowanych ryzyk dla tego projektu.</td>
                </tr>
            </tbody>
        </table>

        <div class="footer">
            Wygenerowano: <span th:text="${#dates.format(#dates.createNow(), 'dd-MM-yyyy HH:mm')}"></span>
        </div>
    </div>
</body>
</html>
